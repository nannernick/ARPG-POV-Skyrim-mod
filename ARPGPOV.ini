; ARPG POV - settings. Editable here or in game (SKSE Menu Framework > ARPG POV).
; Distances are Skyrim units (a human is roughly 128 tall). Key codes are DirectX scan codes.
; Mouse buttons: 0 = left, 1 = right, 2 = middle (mouse 3), 3+ = side buttons.

[Camera]
; Camera lock on at game start (ToggleKey flips it in game).
Enabled = 1
; Preset = Custom uses the Pitch, Distance and Fov lines below. Default is this mod's look (same as Path of Exile 2).
; A game's name replaces them with that game's look: Skyrim ARPG, Diablo II, Path of Exile, Path of Exile 2, Diablo III, Diablo IV, Last Epoch, Grim Dawn, Torchlight II.
Preset = Default
; Pitch = degrees looking down (30 = Path of Exile 2). Yaw only applies with LockYaw.
LockPitch = 1
Pitch = 30
LockYaw = 0
Yaw = 45
; Leave at 0 unless the camera looks up instead of down.
PitchMode = 0
InvertPitch = 0
; Let True Directional Movement hold the camera while target lock is on.
PauseOnTargetLock = 0
; Indoors, draw the room you're in even when the camera is above the ceiling.
FixInteriorRooms = 1
; Keep the camera's compass heading when True Directional Movement tries to turn it (target lock, its camera
; reset, its auto-adjust). Only acts while the mouse is not turning the camera. 0 = leave the heading to TDM.
KeepHeading = 1
; Replaces 3PCO. Manage = 1 applies: Distance from you, Fov in degrees, shoulder offsets (0 = centred),
; and WheelZoom (0 = the mouse wheel does not zoom; use the change-view key for first person).
Manage = 1
Distance = 1290
Fov = 50
OffsetX = 0
OffsetZ = 0
WheelZoom = 0
; Keys: 0x44 = F10, 0xc9 = Page Up, 0xd1 = Page Down, 0x42 = F8. 0 = no key. (0x49 / 0x51 are Numpad 9 / 3.)
ToggleKey = 0x44
PitchUpKey = 0xc9
PitchDownKey = 0xd1
PitchStep = 5
ReloadKey = 0x42
; YawStepKey turns the camera 90 degrees per press (0xd2 = Insert). It only works with LockYaw = 1.
YawStepKey = 0xd2
DebugLog = 0

[Player]
; Applied whenever a save loads. 0 = leave the game's value alone. SpeedMult 100 = vanilla.
CarryWeight = 10000
SpeedMult = 130

[GameSettings]
; Engine settings (the names `setgs` uses), re-applied every launch.
fMoveEncumEffect = 0
fMoveEncumEffectNoWeapon = 0

[Cutaway]
; Cutaway master switch, interiors only, and method (1 = cut, 0 = legacy per-mesh hiding).
Enabled = 1
InteriorOnly = 1
Mode = 1

[Cut]
; Cut height above the floor. Slope applies to the Automatic style only: the cut is at Height at the bottom of the
; screen and rises this fast away from the camera (0 = flat), so walls are never cut lower than in the Default style.
Height = 200
Slope = 0.3
; 1 = every mesh uses the cut projection so depth stays consistent.
AllGeometry = 1
Radius = 2500
; Height is anchored per area; it re-anchors only after standing this far
; above/below it for ReanchorDelay seconds on the ground (jumps never count).
ReanchorDistance = 75
ReanchorDelay = 0.5
; Every height change eases in over ~HeightSmoothing seconds, capped at MaxHeightSpeed.
HeightSmoothing = 0.2
MaxHeightSpeed = 1600
; Style: 0 = Default, always a flat cut at Height. 1 = Automatic (experimental): never lower than that, sloping up
; away from the camera, and rising (up to LiftMax) so walls and ceilings show when nothing is in the way.
; StyleKey switches in game (0x43 = F9).
AutoLift = 0
StyleKey = 0x43
ClearDelay = 0.75
LiftMax = 1600

[Cells]
; Per-interior overrides by editor ID (see the log's [cell] lines): a height, or off.

[Background]
; Black interior fog and no sky dome while inside (what shows through the cut).
BlackFog = 1
HideSky = 1

[Sweep]
; Mode 0 (legacy) only.
HeadHeight = 120
CorridorRadius = 400
Interval = 0.05
MinCameraDistance = 50

[Hide]
; Mode 0 (legacy) only.
MinHeight = 200
CeilingHeight = 350
BehindMargin = 100
MaxShapeRadius = 700
Linger = 1
Hysteresis = 75

[PointClick]
; Point-and-click on at game start. ToggleKey (0x41 = F7) switches back to WASD + mouse look.
Enabled = 1
ToggleKey = 0x41

[Cursor]
; Cursor speed and size. The cursor can never leave the screen.
Sensitivity = 1
Size = 1
; 1 = a ring behind the sword, loot bag and exclamation mark, in the symbol's colour.
Ring = 1
; 1 = this cursor is also used in the inventory, containers, barter and other menus, in place of the game's.
InMenus = 1
; 1 = the mouse moves the cursor instead of the camera. Hold RotateKey to rotate the camera (0 = no key).
BlockMouseLook = 1
RotateKey = 0x0

[Move]
; Button that moves you to the cursor. HoldToMove = keep following the cursor while it's held.
Button = 0
HoldToMove = 1
; Stop this close to the clicked point, and the furthest one click can send you (Skyrim units).
ArriveRadius = 40
MaxDistance = 3000
; 0 = auto, 1 = True Directional Movement, 2 = turn the player directly (no TDM).
Mode = 0
; Clicking a hostile attacks it. AttackInPlaceKey + click attacks toward the cursor (0x2A = Left Shift).
; ClickInteract = clicking an item, container, corpse, door or NPC walks over and uses it.
ClickEnemies = 1
ClickInteract = 1
AttackInPlaceKey = 0x2a
FaceTime = 0.15

[Pickup]
; Extra button that uses what's under the cursor (2 = middle mouse / mouse 3). Out of Range, you walk there first.
Button = 2
Range = 150
; Containers = chests and barrels can be clicked. Actors = corpses (loot) and NPCs (talk) can be clicked.
; Activators = furniture and activators that have a name (seats, levers, the ferry seat) can be clicked. No label.
Containers = 1
Actors = 1
Activators = 1

[Labels]
; 0 = only the item under the cursor, 1 = always, 2 = while Key is held (0x38 = Left Alt).
Mode = 1
Key = 0x38
; How far away items get a label, and how far above/below you (keeps other floors out).
Radius = 2000
MaxHeightDiff = 300
; Items lower than MaxBelow under your feet get no label or click (floors below, hidden merchant chest rooms).
MaxBelow = 60
; Most labels on screen, text size, and a loot filter: hide items worth less than MinValue.
Max = 100
Scale = 0.6
MinValue = 15
; Stacks of at least StackCount read "200x Gold"; smaller stacks show the name only (2 = always show the count).
StackCount = 5
; Loot filter. Always shown: weapons, armor, ammo, potions, scrolls, spell tomes, keys, soul gems, gold, lockpicks,
; gems, ore and ingots. These add the rest: food, ingredients, other books, and clutter (kettles, buckets...).
ShowFood = 0
ShowIngredients = 0
ShowBooks = 0
ShowClutter = 0

[Combat]
; HoldToAttack = holding your attack button swings again and again (melee). Hold PowerAttackKey with it for a
; power attack, as in the base game (0x38 = Left Alt, 0 = no key).
HoldToAttack = 1
PowerAttackKey = 0x38
; AutoAttack = while locked on (True Directional Movement), one press of attack keeps attacking until you press again.
AutoAttack = 0
; AimAtCursor = spells and bows aim at the cursor (or the enemy under it) and not along the tilted camera.
AimAtCursor = 1

[Globes]
; Life and mana globes (Path of Exile style), stamina as a bar on the life globe. HideVanillaBars hides the game's bars.
Enabled = 1
HideVanillaBars = 1
Size = 1
Numbers = 1
Animate = 1

[Outlines]
; True outlines around the model: red = enemies, green = NPCs, FollowerColor = followers, white = you.
; Whatever the cursor is on is always outlined.
Enabled = 1
Enemies = 1
NPCs = 0
Player = 1
; Followers = your followers / teammates get their own colour (0xRRGGBB) and their own switch.
Followers = 1
FollowerColor = 0x50a0ff
; Loot = dropped items (their label colour), containers and corpses (gold). Called Items before 1.6.
; Weapons and shields an NPC is holding are part of that NPC and can't be outlined separately.
Loot = 0
; Thickness = glow size, 1 (a thin line) to 8. Opacity = how strong the glow is. Brightness = how bright
; its colours are (lower = darker). Fade = outlines get fainter with distance.
Thickness = 5
Opacity = 0.9
Brightness = 0.9
Fade = 1
; Radius / ItemRadius: how far from you actors / items get an outline. Each outlined thing costs a little,
; so lower the two radii if frames drop.
Radius = 1500
ItemRadius = 700
; MaxParts = most model parts outlined in one frame (64-1024). An armoured character is many parts, so a crowd
; can reach it; past it the furthest characters get no outline. Higher outlines more of a crowd and costs frames.
MaxParts = 256
; Items, containers and corpses higher than this above your feet get no outline or label (shelves, upper floors).
MaxAbove = 120
; Enemies, NPCs and followers lower than MaxBelow under your feet (or further than [Labels] MaxHeightDiff above
; or below) get no outline or circle. Between the two they still glow while the cursor is on them.
MaxBelow = 150
; Circles = a circle on the ground under enemies, NPCs and followers, in the outline's colour. Uses the Enemies,
; NPCs and Followers switches above and works with Enabled = 0. Drawn over the scene, so it shows through walls.
Circles = 0
CircleRadius = 45
; 1 = things behind you don't glow over your character.
BehindPlayer = 1

[Debug]
Cutaway = 0
PointClick = 0
