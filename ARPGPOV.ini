; ARPG POV - settings. Editable here or in game (SKSE Menu Framework > ARPG POV).
; Distances are Skyrim units (a human is roughly 128 tall). Key codes are DirectX scan codes.
; Mouse buttons: 0 = left, 1 = right, 2 = middle (mouse 3), 3+ = side buttons.

[Camera]
; Camera lock on at game start (ToggleKey flips it in game).
Enabled = 1
; Pitch = degrees looking down (30 = Path of Exile 2). Yaw only applies with LockYaw.
LockPitch = 1
Pitch = 30
LockYaw = 0
Yaw = 45
; Leave at 0 unless the camera looks up instead of down.
PitchMode = 0
InvertPitch = 0
; Let True Directional Movement hold the camera while target lock is on.
PauseOnTargetLock = 0
; Indoors, draw the room you're in even when the camera is above the ceiling.
FixInteriorRooms = 1
; Keys: 0x44 = F10, 0x49 = Page Up, 0x51 = Page Down, 0x42 = F8. 0 = no key.
ToggleKey = 0x44
PitchUpKey = 0x49
PitchDownKey = 0x51
PitchStep = 5
ReloadKey = 0x42
DebugLog = 0

[Player]
; Applied whenever a save loads. 0 = leave the game's value alone. SpeedMult 100 = vanilla.
CarryWeight = 10000
SpeedMult = 130

[GameSettings]
; Engine settings (the names `setgs` uses), re-applied every launch.
fMoveEncumEffect = 0
fMoveEncumEffectNoWeapon = 0

[Cutaway]
; Cutaway master switch, interiors only, and method (1 = cut, 0 = legacy per-mesh hiding).
Enabled = 1
InteriorOnly = 1
Mode = 1

[Cut]
; Cut height above the floor at your position, and how fast it rises behind you
; (1 = 45 deg, 0 = flat; clamped automatically to keep the floor on screen).
Height = 220
Slope = 1
; 1 = every mesh uses the cut projection so depth stays consistent.
AllGeometry = 1
Radius = 2500
; Height is anchored per area; it re-anchors only after standing this far
; above/below it for ReanchorDelay seconds on the ground (jumps never count).
ReanchorDistance = 150
ReanchorDelay = 1
; Every height change eases in over ~HeightSmoothing seconds, capped at MaxHeightSpeed.
HeightSmoothing = 0.6
MaxHeightSpeed = 800
; Style: 0 = always cut (Diablo look), 1 = automatic, cut only when something blocks the view (experimental).
; StyleKey switches in game (0x43 = F9).
AutoLift = 0
StyleKey = 0x43
ClearDelay = 0.75
LiftMax = 600

[Cells]
; Per-interior overrides by editor ID (see the log's [cell] lines): a height, or off.

[Background]
; Black interior fog and no sky dome while inside (what shows through the cut).
BlackFog = 1
HideSky = 1

[Sweep]
; Mode 0 (legacy) only.
HeadHeight = 120
CorridorRadius = 400
Interval = 0.05
MinCameraDistance = 50

[Hide]
; Mode 0 (legacy) only.
MinHeight = 200
CeilingHeight = 350
BehindMargin = 100
MaxShapeRadius = 700
Linger = 1
Hysteresis = 75

[PointClick]
; Point-and-click on at game start. ToggleKey (0x41 = F7) switches back to WASD + mouse look.
Enabled = 1
ToggleKey = 0x41

[Cursor]
; Cursor speed and size. The cursor can never leave the screen.
Sensitivity = 1
Size = 1
; 1 = a ring behind the sword, loot bag and exclamation mark, in the symbol's colour.
Ring = 1
; 1 = this cursor is also used in the inventory, containers, barter and other menus, in place of the game's.
InMenus = 1
; 1 = the mouse moves the cursor instead of the camera. Hold RotateKey to rotate the camera (0 = no key).
BlockMouseLook = 1
RotateKey = 0x0

[Move]
; Button that moves you to the cursor. HoldToMove = keep following the cursor while it's held.
Button = 0
HoldToMove = 1
; Stop this close to the clicked point, and the furthest one click can send you (Skyrim units).
ArriveRadius = 40
MaxDistance = 3000
; 0 = auto, 1 = True Directional Movement, 2 = turn the player directly (no TDM).
Mode = 0
; Clicking a hostile attacks it. AttackInPlaceKey + click attacks toward the cursor (0x2A = Left Shift).
; ClickInteract = clicking an item, container, corpse, door or NPC walks over and uses it.
ClickEnemies = 1
ClickInteract = 1
AttackInPlaceKey = 0x2a
FaceTime = 0.15

[Pickup]
; Extra button that uses what's under the cursor (2 = middle mouse / mouse 3). Out of Range, you walk there first.
Button = 2
Range = 150
; Containers = chests and barrels can be clicked. Actors = corpses (loot) and NPCs (talk) can be clicked.
Containers = 1
Actors = 1

[Labels]
; 0 = only the item under the cursor, 1 = always, 2 = while Key is held (0x38 = Left Alt).
Mode = 1
Key = 0x38
; How far away items get a label, and how far above/below you (keeps other floors out).
Radius = 1500
MaxHeightDiff = 300
; Most labels on screen, text size, and a loot filter: hide items worth less than MinValue.
Max = 60
Scale = 1
MinValue = 0
; Stacks of at least StackCount read "200x Gold"; smaller stacks show the name only (2 = always show the count).
StackCount = 5
; Loot filter. Always shown: weapons, armor, ammo, potions, scrolls, spell tomes, keys, soul gems, gold, lockpicks,
; gems, ore and ingots. These add the rest: food, ingredients, other books, and clutter (kettles, buckets...).
ShowFood = 0
ShowIngredients = 0
ShowBooks = 0
ShowClutter = 0

[Outlines]
; True outlines around the model: red = enemies, white = you and NPCs, items = their label colour.
; Whatever the cursor is on is always outlined.
Enabled = 1
Enemies = 1
NPCs = 1
Items = 1
; Thickness = glow size, 1 (a thin line) to 8. Opacity = how strong the glow is. Brightness = how bright
; its colours are (lower = darker). Fade = outlines get fainter with distance.
Thickness = 3
Opacity = 0.6
Brightness = 0.7
Fade = 1
; Radius / ItemRadius: how far from you actors / items get an outline. Each outlined thing costs a little,
; so lower the two radii if frames drop.
Radius = 3000
ItemRadius = 700
; Items, containers and corpses higher than this above your feet get no outline or label (shelves, upper floors).
MaxAbove = 120
; 1 = things behind you don't glow over your character.
BehindPlayer = 1

[Debug]
Cutaway = 0
PointClick = 0
